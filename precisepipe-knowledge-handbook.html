<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Precise Pipe 公司知识手册</title>
<style>
:root {
  --blue:#002384; --blue-2:#1e49c1; --red:#C6143E; --gold:#de8d00;
  --ink:#111827; --muted:#6b7388; --line:#E8EDF3; --wash:#F6F9FB;
  --card:#ffffff; --soft:#eef3fb; --shadow:0 8px 30px rgba(5,13,62,.07);
  --shadow-h:0 18px 40px rgba(5,13,62,.12);
}
* { box-sizing:border-box; }
html,body { margin:0; background:var(--wash); color:var(--ink); }
body {
  font:15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
  min-height:100vh; display:flex; flex-direction:column;
}
button, input { font:inherit; }
a { color:var(--blue-2); }
.topbar {
  position:sticky; top:0; z-index:30; background:#fff;
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:18px; padding:12px 28px;
}
.brand { display:flex; align-items:center; gap:14px; min-width:0; cursor:pointer; }
.wordmark { height:26px; width:auto; display:block; }
.brand-meta { border-left:1px solid var(--line); padding-left:14px; }
.brand-meta h1 { margin:0; font-size:15px; font-weight:700; color:var(--blue); }
.search-wrap { margin-left:auto; }
.search {
  width:min(340px, 40vw); padding:9px 12px; border:1px solid var(--line);
  border-radius:8px; background:var(--wash); color:var(--ink);
}
.search:focus { outline:2px solid #d9e4ff; border-color:var(--blue); background:#fff; }
.tabs {
  background:#fff; border-bottom:1px solid var(--line);
  display:flex; gap:2px; padding:0 28px; overflow:auto;
}
.tab {
  appearance:none; border:0; background:transparent; color:var(--muted);
  padding:11px 14px; cursor:pointer; font-weight:650; font-size:13px;
  border-bottom:2px solid transparent; white-space:nowrap;
}
.tab:hover { color:var(--blue); }
.tab.on { color:var(--blue); border-bottom-color:var(--red); }
.tab.soon { opacity:.45; cursor:default; pointer-events:none; }
.page {
  width:min(1120px, calc(100% - 48px)); margin:0 auto; flex:1; padding:28px 0 64px;
}
.stage { display:flex; align-items:flex-start; gap:22px; }
.toc {
  width:min(260px, 30%); flex:none;
  display:flex; flex-direction:column; gap:2px;
  max-height:calc(100vh - 170px); overflow:auto;
  position:sticky; top:86px; padding-right:4px;
}
.toc button {
  appearance:none; border:0; background:transparent; text-align:left;
  padding:10px 12px; border-radius:8px; cursor:pointer;
  color:var(--ink); font-weight:600; font-size:13px; line-height:1.35;
  border-left:3px solid transparent; overflow-wrap:anywhere;
}
.toc button:hover { background:#fff; color:var(--blue); }
.toc button.on {
  background:#fff; color:var(--blue); border-left-color:var(--red);
  box-shadow:var(--shadow);
}
.reader {
  flex:1; min-width:0;
  background:#fff; border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); padding:28px 32px 40px;
  max-height:calc(100vh - 170px); overflow:auto;
}
.reader h2 { margin:0 0 16px; font-size:22px; color:var(--blue); }
.crumb {
  display:flex; flex-wrap:wrap; align-items:center; gap:6px;
  font-size:13px; color:var(--muted); margin:0 0 18px;
}
.crumb button {
  appearance:none; border:0; background:none; color:var(--blue-2);
  cursor:pointer; padding:0; font-weight:600;
}
.crumb button:hover { text-decoration:underline; }
.crumb .sep { opacity:.4; }
.grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
  gap:18px;
}
.page.home .grid,
.page.l2 .grid {
  grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
  gap:14px;
}
.tile {
  appearance:none; border:1px solid var(--line); background:var(--card);
  border-radius:14px; padding:0; text-align:left; cursor:pointer;
  box-shadow:var(--shadow); overflow:hidden; color:inherit;
  display:flex; flex-direction:column;
  animation:rise .45s ease both;
  transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
}
.tile:hover { transform:translateY(-8px) scale(1.02); box-shadow:var(--shadow-h); border-color:#cfd9ee; }
.tile:active { transform:translateY(-2px); }
.tile .art {
  height:132px; background:linear-gradient(180deg, #f4f7fd, #e8eef8);
  display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
}
.tile .art svg { width:86%; height:86%; overflow:visible; }
.tile .art svg * { transform-box:fill-box; transform-origin:center; }
.tile[data-kind="SOP"] .ico-paper { animation:bob 3s ease-in-out infinite; }
.tile[data-kind="SOP"] .ico-note { animation:bob 3s ease-in-out infinite .35s; }
.tile[data-kind="Logistics"] .ico-wh { animation:bob 3.4s ease-in-out infinite; }
.tile[data-kind="Logistics"] .ico-truck { animation:drive 2.6s ease-in-out infinite; }
.tile[data-kind="Inventory"] .ico-box { animation:tilt 3.2s ease-in-out infinite; }
.tile[data-kind="Inventory"] .ico-tag { animation:bob 2.8s ease-in-out infinite .2s; }
.tile[data-kind="Systems"] .ico-blk { animation:pulseBlk 2.4s ease-in-out infinite; }
.tile[data-kind="Systems"] .ico-hot { animation:pulseHot 1.8s ease-in-out infinite; }
.tile[data-kind="Other"] .ico-target { animation:spinSlow 8s linear infinite; }
.tile[data-kind="Other"] .ico-dot { animation:pulseHot 1.6s ease-in-out infinite; }
.tile[data-theme="mail"] .ico-a { animation:bob 2.8s ease-in-out infinite; }
.tile[data-theme="mail"] .ico-b { animation:bob 2.8s ease-in-out infinite .25s; }
.tile[data-theme="tell"] .ico-a { animation:bob 3s ease-in-out infinite; }
.tile[data-theme="tell"] .ico-b { animation:pulseHot 1.8s ease-in-out infinite; }
.tile[data-theme="late"] .ico-a { animation:spinSlow 8s linear infinite; }
.tile[data-theme="late"] .ico-b { animation:pulseHot 1.6s ease-in-out infinite; }
.tile[data-theme="docs"] .ico-a { animation:bob 3s ease-in-out infinite; }
.tile[data-theme="docs"] .ico-b { animation:bob 3s ease-in-out infinite .3s; }
.tile[data-theme="collect"] .ico-a { animation:bob 2.6s ease-in-out infinite; }
.tile[data-theme="collect"] .ico-b { animation:tilt 2.8s ease-in-out infinite; }
.tile[data-theme="team"] .ico-a { animation:bob 3.2s ease-in-out infinite; }
.tile[data-theme="team"] .ico-b { animation:bob 3.2s ease-in-out infinite .35s; }
.tile[data-theme="book"] .ico-a { animation:bob 3.4s ease-in-out infinite; }
.tile[data-theme="book"] .ico-b { animation:drive 2.8s ease-in-out infinite; }
.tile[data-theme="mix"] .ico-a { animation:bob 3s ease-in-out infinite; }
.tile[data-theme="mix"] .ico-b { animation:tilt 3.2s ease-in-out infinite; }
.tile[data-theme="rail"] .ico-a { animation:drive 2.4s ease-in-out infinite; }
.tile[data-theme="rail"] .ico-b { animation:bob 3s ease-in-out infinite; }
.tile[data-theme="truck"] .ico-a { animation:drive 2.6s ease-in-out infinite; }
.tile[data-theme="truck"] .ico-b { animation:bob 3.2s ease-in-out infinite; }
.tile[data-theme="rack"] .ico-a { animation:tilt 3s ease-in-out infinite; }
.tile[data-theme="rack"] .ico-b { animation:bob 2.8s ease-in-out infinite; }
.tile[data-theme="check"] .ico-a { animation:bob 3s ease-in-out infinite; }
.tile[data-theme="check"] .ico-b { animation:pulseHot 1.8s ease-in-out infinite; }
.tile[data-theme="cmd"] .ico-a { animation:pulseBlk 1.4s ease-in-out infinite; }
.tile[data-theme="cmd"] .ico-b { animation:bob 3s ease-in-out infinite; }
.tile[data-theme="ros"] .ico-a { animation:bob 3.2s ease-in-out infinite; }
.tile[data-theme="ros"] .ico-b { animation:pulseBlk 2s ease-in-out infinite; }
.tile[data-theme="kpi"] .ico-a { animation:bob 2.8s ease-in-out infinite; }
.tile[data-theme="kpi"] .ico-b { animation:pulseHot 1.7s ease-in-out infinite; }
.tile[data-theme="board"] .ico-a { animation:pulseBlk 2.2s ease-in-out infinite; }
.tile[data-theme="board"] .ico-b { animation:bob 3s ease-in-out infinite .2s; }
.tile[data-theme="pay"] .ico-a { animation:tilt 3s ease-in-out infinite; }
.tile[data-theme="pay"] .ico-b { animation:bob 2.8s ease-in-out infinite; }
.tile[data-theme="rush"] .ico-a { animation:pulseHot 1.5s ease-in-out infinite; }
.tile[data-theme="rush"] .ico-b { animation:bob 2.6s ease-in-out infinite; }
@keyframes bob { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
@keyframes drive { 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(8px); } }
@keyframes tilt { 0%,100%{ transform:rotate(0deg); } 50%{ transform:rotate(-4deg) translateY(-3px); } }
@keyframes pulseBlk { 0%,100%{ opacity:1; } 50%{ opacity:.55; } }
@keyframes pulseHot { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.18); } }
@keyframes spinSlow { from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
.tile .meta { padding:14px 16px 16px; }
.tile .meta h3 { margin:0; font-size:16px; font-weight:750; color:var(--blue); }
.badge {
  position:absolute; top:12px; right:12px; background:#fff; color:var(--blue);
  border:1px solid var(--line); border-radius:999px; font-size:12px; font-weight:700;
  padding:2px 8px;
}
.sec { margin:14px 0 0; padding-left:12px; border-left:3px solid #d9e4ff; }
.sec .k { font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--blue); margin:0 0 4px; }
.sec.k-动作 .k { color:var(--blue-2); }
.sec.k-例外 .k { color:var(--red); }
.sec.k-触发条件 .k, .sec.k-阈值 .k { color:var(--gold); }
.sec ul { margin:0; padding-left:18px; }
.sec li { margin:3px 0; }
.orig { margin-top:16px; font-size:13px; color:var(--muted); }
.orig summary { cursor:pointer; }
.orig pre { white-space:pre-wrap; background:var(--wash); border:1px solid var(--line); border-radius:8px; padding:10px 12px; color:var(--ink); }
.placeholder { background:#fff; border:1px dashed var(--line); border-radius:14px; padding:56px 28px; text-align:center; color:var(--muted); }
.placeholder h3 { color:var(--blue); margin:0 0 8px; }
.empty { color:var(--muted); padding:24px 0; }
.mark { background:#fdec99; padding:0 2px; }
@keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }

.page.home { width:min(1180px, calc(100% - 32px)); padding-top:4px; padding-bottom:40px; }
.home-stage {
  position:relative; display:flex; align-items:center; justify-content:center;
  min-height:min(58vh, 540px); margin:0 0 18px; overflow:hidden;
}
.home-mark {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  pointer-events:none; opacity:.05;
}
.home-mark svg { width:min(880px, 88%); height:auto; }
#globe { position:relative; z-index:1; display:block; width:min(720px, 100%); height:min(52vh, 520px); }
@media (max-width:900px) {
  .page.home .grid, .page.l2 .grid { grid-template-columns:repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  .tile { animation:none; }
  .tile .art svg, .tile .art svg * { animation:none !important; }
}
@media (max-width:760px) {
  .home-stage { min-height:300px; }
  #globe { height:280px; }
  .page.home .grid, .page.l2 .grid { grid-template-columns:1fr; }
  .topbar,.tabs { padding-left:16px; padding-right:16px; }
  .page { width:calc(100% - 24px); }
  .brand-meta { display:none; }
  .search { width:min(100%, 180px); }
  .stage { flex-direction:column; gap:14px; }
  .toc {
    width:100%; max-height:none; position:static;
    flex-direction:row; overflow:auto; gap:8px; padding-bottom:4px;
  }
  .toc button { white-space:nowrap; border-left:0; border-bottom:3px solid transparent; }
  .toc button.on { border-bottom-color:var(--red); }
  .reader { max-height:none; padding:20px 18px 28px; }
}
</style>
</head>

function hashForState(){

  const ai = sheetSpec ? sheetSpec.split(':')[2] : '0';

function syncHash(){
  const h=hashForState();

  history.replaceState(null,'', h ? '#'+h : (location.pathname+location.search));
}
function applyHash(){
  const h=decodeURIComponent((location.hash||'').replace(/^#/,''));
  const inp=document.getElementById('q');
  mod='operation';
  if(!h){
    q=''; if(inp) inp.value='';
    route={lv:1,cat:null,gi:null}; sheetSpec=null;
    return;
  }
  if(h.slice(0,2)==='q='){
    q=h.slice(2); if(inp) inp.value=q;
    route={lv:1,cat:null,gi:null}; sheetSpec=null;
    return;
  }
  q=''; if(inp) inp.value='';
  const parts=h.split('/');
  const cat=catById(parts[0]);
  if(!cat){ route={lv:1,cat:null,gi:null}; sheetSpec=null; return; }
  if(parts.length===1){
    route={lv:2,cat:parts[0],gi:null}; sheetSpec=null;
    return;
  }
  const gi=Number(parts[1]);
  const g=cat.groups && cat.groups[gi];
  if(!g){ route={lv:2,cat:parts[0],gi:null}; sheetSpec=null; return; }
  const ai=Math.min(Math.max(0, Number(parts[2])||0), Math.max(0,(g.articles||[]).length-1));
  route={lv:3,cat:parts[0],gi};
  sheetSpec=parts[0]+':'+gi+':'+ai;
}

  const i=btns.findIndex(b=>b.dataset.open===sheetSpec);
  const n=btns[Math.min(btns.length-1, Math.max(0, (i<0?0:i)+dir))];
  if(n) openArt(n.dataset.open);

let LAND_CELLS=null;
let LAND_BUILDING=false;
function ensureLand(land){
  if(LAND_CELLS || LAND_BUILDING) return;
  LAND_BUILDING=true;
  setTimeout(()=>{ LAND_CELLS=buildLandCells(land); LAND_BUILDING=false; }, 0);

function splitDateline(a, b){
  let lon1=a[0], lon2=b[0];
  if(Math.abs(lon2-lon1)<=180) return [[[lon1,a[1]],[lon2,b[1]]]];
  if(lon2-lon1>180) lon2-=360; else lon2+=360;
  const seam=lon1<lon2?180:-180;
  const t=(seam-lon1)/(lon2-lon1);
  const lat=a[1]+t*(b[1]-a[1]);
  return [[[a[0],a[1]],[seam,lat]],[[-seam,lat],[b[0],b[1]]]];
}
function buildLandCells(rings){
  const edges=[];
  for(const ring of rings){
    for(let i=0;i<ring.length;i++){
      const parts=splitDateline(ring[i], ring[(i+1)%ring.length]);
      for(const e of parts) edges.push(e);
    }
  }
  const d=2, cells=[];
  for(let lat=-88; lat<88; lat+=d){
    for(let lon=-180; lon<180; lon+=d){
      const x=lon+d/2, y=lat+d/2;
      let inside=false;
      for(let k=0;k<edges.length;k++){
        const p=edges[k][0], q=edges[k][1];
        if(((p[1]>y)!==(q[1]>y)) && (x<(q[0]-p[0])*(y-p[1])/(q[1]-p[1])+p[0])) inside=!inside;
      }
      if(inside) cells.push([lon, lat]);
    }
  }
  return cells;
}

      const p=project(loc.lng, loc.lat, rot, R, cx, cy);
      if(!p) continue;
      ctx.beginPath(); ctx.arc(p[0],p[1], 6+pulse*2.2, 0, Math.PI*2);
      ctx.fillStyle='rgba(0,35,132,'+(0.10+pulse*0.10)+')'; ctx.fill();
      ctx.beginPath(); ctx.arc(p[0],p[1], 3.2, 0, Math.PI*2);
      ctx.fillStyle='#002384'; ctx.fill();
    }
    if(reduce) return;
    globeRaf=requestAnimationFrame(draw);
  }
  globeResize=()=>{ size(); if(reduce) draw(performance.now()); };
  window.addEventListener('resize', globeResize);
  globeRaf=requestAnimationFrame(draw);
}

function paint(){
  stopGlobe();
  const page=document.getElementById('page');
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.mod===mod));
  const needle=q.trim();
  const isHome = mod==='operation' && route.lv===1 && !needle;
  page.classList.toggle('home', isHome);
  page.classList.toggle('l2', mod==='operation' && route.lv===2 && !needle);
  if(mod!=='operation'){ page.innerHTML=renderPlace(mod); return; }
  let html='';
  if(needle) html=renderSearch();
  else if(route.lv===1) html=renderL1();
  else if(route.lv===2) html=renderL2(catById(route.cat));
  else html=renderL3(catById(route.cat), route.gi);
  page.innerHTML=html;
  bind();
  requestAnimationFrame(()=>{ fillReader(); if(isHome) startGlobe(); });
  if(!document.getElementById('detail')){
    document.title='Precise Pipe 公司知识手册';
    syncHash();
  }
}
function go(spec){
  if(!spec) return;
  const p=String(spec).split(':');
  if(p[0]==='l1'){ route={lv:1,cat:null,gi:null}; sheetSpec=null; }
  else if(p[0]==='l2'){ route={lv:2,cat:p[1],gi:null}; sheetSpec=null; }
  else if(p[0]==='l3'){
    route={lv:3,cat:p[1],gi:Number(p[2])};
    const cat=catById(p[1]);
    const g=cat && cat.groups[Number(p[2])];
    sheetSpec = (g && g.articles && g.articles[0]) ? p[1]+':'+p[2]+':0' : null;
  }
  paint();
}
function openArt(spec){
  sheetSpec=spec;
  if(!document.getElementById('detail')) paint();
  else fillReader();
}
function bind(){
  document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));
  document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openArt(el.dataset.open)));
}
function home(){
  q='';
  const inp=document.getElementById('q');
  if(inp) inp.value='';
  mod='operation';
  route={lv:1,cat:null,gi:null};
  sheetSpec=null;
  paint();
}
document.querySelector('.brand').addEventListener('click', home);
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  if(b.classList.contains('soon')) return;
  mod=b.dataset.mod; route={lv:1,cat:null,gi:null}; sheetSpec=null; paint();
}));
let qTimer=0;
document.getElementById('q').addEventListener('input',e=>{
  q=e.target.value;
  clearTimeout(qTimer);
  qTimer=setTimeout(()=>{ if(mod==='operation') paint(); }, 140);
});
document.addEventListener('keydown',e=>{
  const inField=e.target.closest('input,textarea,select,[contenteditable]');
  if(e.key==='/' && !inField){
    e.preventDefault();
    document.getElementById('q').focus();
    return;
  }
  if(e.key==='Escape'){
    if(q.trim()){
      q='';
      document.getElementById('q').value='';
      paint();
      return;
    }
    if(route.lv===3) go('l2:'+route.cat);
    else if(route.lv===2) go('l1');
    return;
  }
  if(inField) return;
  if(e.key==='ArrowDown' || e.key==='j'){ e.preventDefault(); stepArt(1); }
  if(e.key==='ArrowUp' || e.key==='k'){ e.preventDefault(); stepArt(-1); }
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) stopGlobe();
  else if(document.getElementById('globe')) startGlobe();
});
window.addEventListener('hashchange',()=>{ applyHash(); paint(); });
applyHash();
paint();
</script>
</body>
</html>
